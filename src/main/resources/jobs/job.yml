job:
  name: correlation_sip_rtp_session
  parallelism: 1
  active-pipeline:
    - only-voip-records
    - fusion-fail-records
    - all-errors-records

source:
  - name: session-records
    type: kafka
    option:
      topic: VOIP-RECORD
      properties:
        bootstrap.servers: 192.168.44.12:9094
        group.id: sip-rtp-correlation
        security.protocol: SASL_PLAINTEXT
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="galaxy2019";
    format: json
    schema:
      ## General
      - name: recv_time
        data-type: BIGINT NOT NULL
      - name: log_id
        data-type: BIGINT NOT NULL
      - name: decoded_as
        data-type: STRING NOT NULL
      - name: session_id
        data-type: BIGINT NOT NULL
      - name: start_timestamp_ms
        data-type: BIGINT NOT NULL
      # row-time:
      - name: start_timestamp
        for: TO_TIMESTAMP_LTZ(start_timestamp_ms, 3)
        watermark: start_timestamp - INTERVAL '5' MINUTE
      - name: end_timestamp_ms
        data-type: BIGINT
      - name: duration_ms
        data-type: INT
      - name: tcp_handshake_latency_ms
        data-type: INT
      - name: ingestion_time
        data-type: BIGINT
      - name: processing_time
        data-type: BIGINT
      - name: insert_time
        data-type: BIGINT
      - name: device_id
        data-type: STRING
      - name: out_link_id
        data-type: INT
      - name: in_link_id
        data-type: INT
      - name: device_tag
        data-type: STRING
      - name: data_center
        data-type: STRING
      - name: device_group
        data-type: STRING
      - name: sled_ip
        data-type: STRING
      - name: address_type
        data-type: INT
      - name: direction
        data-type: STRING
      - name: vsys_id
        data-type: INT
      - name: t_vsys_id
        data-type: INT
      - name: flags
        data-type: BIGINT
      - name: flags_identify_info
        data-type: STRING
      - name: c2s_ttl
        data-type: INT
      - name: s2c_ttl
        data-type: INT
      ## Treatment
      - name: security_rule_list
        data-type: ARRAY<BIGINT>
      - name: security_action
        data-type: STRING
      - name: monitor_rule_list
        data-type: ARRAY<BIGINT>
      - name: shaping_rule_list
        data-type: ARRAY<BIGINT>
      - name: proxy_rule_list
        data-type: ARRAY<BIGINT>
      - name: statistics_rule_list
        data-type: ARRAY<BIGINT>
      - name: sc_rule_list
        data-type: ARRAY<BIGINT>
      - name: sc_rsp_raw
        data-type: ARRAY<BIGINT>
      - name: sc_rsp_decrypted
        data-type: ARRAY<BIGINT>
      - name: proxy_action
        data-type: STRING
      - name: proxy_pinning_status
        data-type: INT
      - name: proxy_intercept_status
        data-type: INT
      - name: proxy_passthrough_reason
        data-type: STRING
      - name: proxy_client_side_latency_ms
        data-type: INT
      - name: proxy_server_side_latency_ms
        data-type: INT
      - name: proxy_client_side_version
        data-type: STRING
      - name: proxy_server_side_version
        data-type: STRING
      - name: proxy_cert_verify
        data-type: INT
      - name: proxy_intercept_error
        data-type: STRING
      - name: monitor_mirrored_pkts
        data-type: INT
      - name: monitor_mirrored_bytes
        data-type: INT
      ## Source
      - name: client_ip
        data-type: STRING
      - name: client_port
        data-type: INT
      - name: client_os_desc
        data-type: STRING
      - name: client_geolocation
        data-type: STRING
      - name: client_country
        data-type: STRING
      - name: client_super_administrative_area
        data-type: STRING
      - name: client_administrative_area
        data-type: STRING
      - name: client_sub_administrative_area
        data-type: STRING
      - name: client_asn
        data-type: BIGINT
      - name: subscriber_id
        data-type: STRING
      - name: imei
        data-type: STRING
      - name: imsi
        data-type: STRING
      - name: phone_number
        data-type: STRING
      - name: apn
        data-type: STRING
      ## Destination
      - name: server_ip
        data-type: STRING
      - name: server_port
        data-type: INT
      - name: server_os_desc
        data-type: STRING
      - name: server_geolocation
        data-type: STRING
      - name: server_country
        data-type: STRING
      - name: server_super_administrative_area
        data-type: STRING
      - name: server_administrative_area
        data-type: STRING
      - name: server_sub_administrative_area
        data-type: STRING
      - name: server_asn
        data-type: BIGINT
      - name: server_fqdn
        data-type: STRING
      - name: server_domain
        data-type: STRING
      - name: fqdn_category_list
        data-type: ARRAY<INT>
      ## Application
      - name: app_transition
        data-type: STRING
      - name: app
        data-type: STRING
      - name: app_category
        data-type: STRING
      - name: app_debug_info
        data-type: STRING
      - name: app_content
        data-type: STRING
      - name: app_extra_info
        data-type: STRING
      ## Protocol
      - name: ip_protocol
        data-type: STRING
      - name: decoded_path
        data-type: STRING
      ## Transmission
      - name: sent_pkts
        data-type: BIGINT
      - name: received_pkts
        data-type: BIGINT
      - name: sent_bytes
        data-type: BIGINT
      - name: received_bytes
        data-type: BIGINT
      - name: tcp_c2s_ip_fragments
        data-type: BIGINT
      - name: tcp_s2c_ip_fragments
        data-type: BIGINT
      - name: tcp_c2s_lost_bytes
        data-type: BIGINT
      - name: tcp_s2c_lost_bytes
        data-type: BIGINT
      - name: tcp_c2s_o3_pkts
        data-type: BIGINT
      - name: tcp_s2c_o3_pkts
        data-type: BIGINT
      - name: tcp_c2s_rtx_pkts
        data-type: BIGINT
      - name: tcp_s2c_rtx_pkts
        data-type: BIGINT
      - name: tcp_c2s_rtx_bytes
        data-type: BIGINT
      - name: tcp_s2c_rtx_bytes
        data-type: BIGINT
      - name: tcp_rtt_ms
        data-type: INT
      - name: tcp_client_isn
        data-type: BIGINT
      - name: tcp_server_isn
        data-type: BIGINT
      ## Other
      - name: packet_capture_file
        data-type: STRING
      - name: in_src_mac
        data-type: STRING
      - name: out_src_mac
        data-type: STRING
      - name: in_dest_mac
        data-type: STRING
      - name: out_dest_mac
        data-type: STRING
      - name: encapsulation
        data-type: STRING
      - name: dup_traffic_flag
        data-type: INT
      - name: tunnel_id_list
        data-type: ARRAY<BIGINT>
      - name: tunnel_endpoint_a_desc
        data-type: STRING
      - name: tunnel_endpoint_b_desc
        data-type: STRING
      ## SIP
      - name: sip_call_id
        data-type: STRING
      - name: sip_originator_description
        data-type: STRING
      - name: sip_responder_description
        data-type: STRING
      - name: sip_user_agent
        data-type: STRING
      - name: sip_server
        data-type: STRING
      - name: sip_originator_sdp_connect_ip
        data-type: STRING
      - name: sip_originator_sdp_media_port
        data-type: INT
      - name: sip_originator_sdp_media_type
        data-type: STRING
      - name: sip_originator_sdp_content
        data-type: STRING
      - name: sip_responder_sdp_connect_ip
        data-type: STRING
      - name: sip_responder_sdp_media_port
        data-type: INT
      - name: sip_responder_sdp_media_type
        data-type: STRING
      - name: sip_responder_sdp_content
        data-type: STRING
      - name: sip_duration_s
        data-type: INT
      - name: sip_bye
        data-type: STRING
      ## RTP
      - name: rtp_payload_type_c2s
        data-type: INT
      - name: rtp_payload_type_s2c
        data-type: INT
      - name: rtp_pcap_path
        data-type: STRING
      - name: rtp_originator_dir
        data-type: INT

sink:
  # 错误的 SIP 和 RTP
  - name: all-errors-records
    type: kafka
    on: errors-records
    option:
      topic: VOIP-CONVERSATTON-RECORD
      properties:
        bootstrap.servers: 192.168.44.12:9094
        security.protocol: SASL_PLAINTEXT
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="galaxy2019";
    format: json
  # 关联成功的 VOIP
  - name: only-voip-records
    on: voip-fusion.ok
    type: kafka
    option:
      topic: VOIP-CONVERSATTON-RECORD
      properties:
        bootstrap.servers: 192.168.44.12:9094
        security.protocol: SASL_PLAINTEXT
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="galaxy2019";
    format: json
  # 没有关联成功的 SIP 和 RTP
  - name: fusion-fail-records
    on: cannot-fusion-records
    type: kafka
    option:
      topic: VOIP-CONVERSATTON-RECORD
      properties:
        bootstrap.servers: 192.168.44.12:9094
        security.protocol: SASL_PLAINTEXT
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="galaxy2019";
    format: json

pipeline:
  - name: split-for-valid
    category: SPLIT
    on: session-records
    splits:
      # Invalid ip or port
      - name: error1-records
        where: NOT(IS_IP_ADDRESS(client_ip)) || NOT(IS_IP_ADDRESS(server_ip)) || client_port <= 0 || server_port <= 0
      # Invalid stream dir
      - name: error2-records
        where: decoded_as == 'SIP' &&STREAM_DIR(flags) != 1 && STREAM_DIR(flags) != 2 && STREAM_DIR(flags) != 3
      # Invalid: SIP one-way stream and has invalid network address
      - name: error3-records
        where: decoded_as == 'SIP' && ( NOT(HAS_IP_ADDRESS(sip_originator_sdp_connect_ip, sip_responder_sdp_connect_ip)) || sip_originator_sdp_media_port <= 0 || sip_responder_sdp_media_port <= 0 )
      - name: error4-records
        where: decoded_as == 'SIP' && STREAM_DIR(flags) == 3 && ( NOT( IS_IP_ADDRESS(sip_originator_sdp_connect_ip) ) || NOT( IS_IP_ADDRESS(sip_responder_sdp_connect_ip) ) )

      ### Notes: If internal IP address correlate is needed, please uncomment the following two items
  #      # Invalid: SIP one-way stream and internal network address
  #      - name: internal-error1-records
  #        where: decoded_as == 'SIP' && NOT(HAS_EXTERNAL_IP_ADDRESS(sip_originator_sdp_connect_ip, sip_responder_sdp_connect_ip))
  #      # Invalid: SIP double-way stream and internal network address
  #      - name: internal-error2-records
  #        where: decoded_as == 'SIP' && STREAM_DIR(flags) == 3 && ( NOT( IS_EXTERNAL_IP_ADDRESS(sip_originator_sdp_connect_ip) ) || NOT( IS_EXTERNAL_IP_ADDRESS(sip_responder_sdp_connect_ip) ) )
  - name: split-by-protocol
    category: SPLIT
    on: split-for-valid
    splits:
      - name: rtp-records
        where: decoded_as == 'RTP'
      - name: sip-records
        where: decoded_as == 'SIP'
  - name: sip-double-way-records
    category: CORRELATE
    cache:
      - name: v1
        type: VALUE
        ttl: 1 minute
        schema:
          ## General
          - name: recv_time
            data-type: BIGINT NOT NULL
          - name: log_id
            data-type: BIGINT NOT NULL
          - name: decoded_as
            data-type: STRING NOT NULL
          - name: session_id
            data-type: BIGINT NOT NULL
          - name: start_timestamp_ms
            data-type: BIGINT NOT NULL
          # row-time:
          - name: start_timestamp
            data-type: TIMESTAMP_LTZ(3)
          - name: end_timestamp_ms
            data-type: BIGINT
          - name: duration_ms
            data-type: INT
          - name: tcp_handshake_latency_ms
            data-type: INT
          - name: ingestion_time
            data-type: BIGINT
          - name: processing_time
            data-type: BIGINT
          - name: insert_time
            data-type: BIGINT
          - name: device_id
            data-type: STRING
          - name: out_link_id
            data-type: INT
          - name: in_link_id
            data-type: INT
          - name: device_tag
            data-type: STRING
          - name: data_center
            data-type: STRING
          - name: device_group
            data-type: STRING
          - name: sled_ip
            data-type: STRING
          - name: address_type
            data-type: INT
          - name: direction
            data-type: STRING
          - name: vsys_id
            data-type: INT
          - name: t_vsys_id
            data-type: INT
          - name: flags
            data-type: BIGINT
          - name: flags_identify_info
            data-type: STRING
          - name: c2s_ttl
            data-type: INT
          - name: s2c_ttl
            data-type: INT
          ## Treatment
          - name: security_rule_list
            data-type: ARRAY<BIGINT>
          - name: security_action
            data-type: STRING
          - name: monitor_rule_list
            data-type: ARRAY<BIGINT>
          - name: shaping_rule_list
            data-type: ARRAY<BIGINT>
          - name: proxy_rule_list
            data-type: ARRAY<BIGINT>
          - name: statistics_rule_list
            data-type: ARRAY<BIGINT>
          - name: sc_rule_list
            data-type: ARRAY<BIGINT>
          - name: sc_rsp_raw
            data-type: ARRAY<BIGINT>
          - name: sc_rsp_decrypted
            data-type: ARRAY<BIGINT>
          - name: proxy_action
            data-type: STRING
          - name: proxy_pinning_status
            data-type: INT
          - name: proxy_intercept_status
            data-type: INT
          - name: proxy_passthrough_reason
            data-type: STRING
          - name: proxy_client_side_latency_ms
            data-type: INT
          - name: proxy_server_side_latency_ms
            data-type: INT
          - name: proxy_client_side_version
            data-type: STRING
          - name: proxy_server_side_version
            data-type: STRING
          - name: proxy_cert_verify
            data-type: INT
          - name: proxy_intercept_error
            data-type: STRING
          - name: monitor_mirrored_pkts
            data-type: INT
          - name: monitor_mirrored_bytes
            data-type: INT
          ## Source
          - name: client_ip
            data-type: STRING
          - name: client_port
            data-type: INT
          - name: client_os_desc
            data-type: STRING
          - name: client_geolocation
            data-type: STRING
          - name: client_country
            data-type: STRING
          - name: client_super_administrative_area
            data-type: STRING
          - name: client_administrative_area
            data-type: STRING
          - name: client_sub_administrative_area
            data-type: STRING
          - name: client_asn
            data-type: BIGINT
          - name: subscriber_id
            data-type: STRING
          - name: imei
            data-type: STRING
          - name: imsi
            data-type: STRING
          - name: phone_number
            data-type: STRING
          - name: apn
            data-type: STRING
          ## Destination
          - name: server_ip
            data-type: STRING
          - name: server_port
            data-type: INT
          - name: server_os_desc
            data-type: STRING
          - name: server_geolocation
            data-type: STRING
          - name: server_country
            data-type: STRING
          - name: server_super_administrative_area
            data-type: STRING
          - name: server_administrative_area
            data-type: STRING
          - name: server_sub_administrative_area
            data-type: STRING
          - name: server_asn
            data-type: BIGINT
          - name: server_fqdn
            data-type: STRING
          - name: server_domain
            data-type: STRING
          - name: fqdn_category_list
            data-type: ARRAY<INT>
          ## Application
          - name: app_transition
            data-type: STRING
          - name: app
            data-type: STRING
          - name: app_category
            data-type: STRING
          - name: app_debug_info
            data-type: STRING
          - name: app_content
            data-type: STRING
          - name: app_extra_info
            data-type: STRING
          ## Protocol
          - name: ip_protocol
            data-type: STRING
          - name: decoded_path
            data-type: STRING
          ## Transmission
          - name: sent_pkts
            data-type: BIGINT
          - name: received_pkts
            data-type: BIGINT
          - name: sent_bytes
            data-type: BIGINT
          - name: received_bytes
            data-type: BIGINT
          - name: tcp_c2s_ip_fragments
            data-type: BIGINT
          - name: tcp_s2c_ip_fragments
            data-type: BIGINT
          - name: tcp_c2s_lost_bytes
            data-type: BIGINT
          - name: tcp_s2c_lost_bytes
            data-type: BIGINT
          - name: tcp_c2s_o3_pkts
            data-type: BIGINT
          - name: tcp_s2c_o3_pkts
            data-type: BIGINT
          - name: tcp_c2s_rtx_pkts
            data-type: BIGINT
          - name: tcp_s2c_rtx_pkts
            data-type: BIGINT
          - name: tcp_c2s_rtx_bytes
            data-type: BIGINT
          - name: tcp_s2c_rtx_bytes
            data-type: BIGINT
          - name: tcp_rtt_ms
            data-type: INT
          - name: tcp_client_isn
            data-type: BIGINT
          - name: tcp_server_isn
            data-type: BIGINT
          ## Other
          - name: packet_capture_file
            data-type: STRING
          - name: in_src_mac
            data-type: STRING
          - name: out_src_mac
            data-type: STRING
          - name: in_dest_mac
            data-type: STRING
          - name: out_dest_mac
            data-type: STRING
          - name: encapsulation
            data-type: STRING
          - name: dup_traffic_flag
            data-type: INT
          - name: tunnel_id_list
            data-type: ARRAY<BIGINT>
          - name: tunnel_endpoint_a_desc
            data-type: STRING
          - name: tunnel_endpoint_b_desc
            data-type: STRING
          ## SIP
          - name: sip_call_id
            data-type: STRING
          - name: sip_originator_description
            data-type: STRING
          - name: sip_responder_description
            data-type: STRING
          - name: sip_user_agent
            data-type: STRING
          - name: sip_server
            data-type: STRING
          - name: sip_originator_sdp_connect_ip
            data-type: STRING
          - name: sip_originator_sdp_media_port
            data-type: INT
          - name: sip_originator_sdp_media_type
            data-type: STRING
          - name: sip_originator_sdp_content
            data-type: STRING
          - name: sip_responder_sdp_connect_ip
            data-type: STRING
          - name: sip_responder_sdp_media_port
            data-type: INT
          - name: sip_responder_sdp_media_type
            data-type: STRING
          - name: sip_responder_sdp_content
            data-type: STRING
          - name: sip_duration_s
            data-type: INT
          - name: sip_bye
            data-type: STRING
          ## RTP
          - name: rtp_payload_type_c2s
            data-type: INT
          - name: rtp_payload_type_s2c
            data-type: INT
          - name: rtp_pcap_path
            data-type: STRING
          - name: rtp_originator_dir
            data-type: INT
    where:
      - on: sip-records
        key-by: vsys_id, sip_call_id, SORT_ADDRESS( client_ip, client_port, server_ip, server_port )
        process:
          - if: STREAM_DIR(flags) != 3 && @v1.isNotNull && STREAM_DIR(@v1.$flags) != STREAM_DIR(flags)
            then:
              - |-
                OUTPUT ok FROM withColumns(recv_time to sip_call_id),
                      FIND_NOT_BLANK(@v1.$sip_originator_description, sip_originator_description) AS sip_originator_description,
                      FIND_NOT_BLANK(@v1.$sip_responder_description, sip_responder_description) AS sip_responder_description,
                      FIND_NOT_BLANK(@v1.$sip_user_agent, sip_user_agent) AS sip_user_agent,
                      FIND_NOT_BLANK(@v1.$sip_server, sip_server) AS sip_server,
                      FIND_NOT_BLANK(@v1.$sip_originator_sdp_connect_ip, sip_originator_sdp_connect_ip) AS sip_originator_sdp_connect_ip,
                      (@v1.$sip_originator_sdp_media_port > 0).?(@v1.$sip_originator_sdp_media_port, sip_originator_sdp_media_port) AS sip_originator_sdp_media_port,
                      FIND_NOT_BLANK(@v1.$sip_originator_sdp_media_type, sip_originator_sdp_media_type) AS sip_originator_sdp_media_type,
                      FIND_NOT_BLANK(@v1.$sip_originator_sdp_content, sip_originator_sdp_content) AS sip_originator_sdp_content,
                      FIND_NOT_BLANK(@v1.$sip_responder_sdp_connect_ip, sip_responder_sdp_connect_ip) AS sip_responder_sdp_connect_ip,
                      (@v1.$sip_responder_sdp_media_port > 0).?(@v1.$sip_responder_sdp_media_port, sip_responder_sdp_media_port) AS sip_responder_sdp_media_port,
                      FIND_NOT_BLANK(@v1.$sip_responder_sdp_media_type, sip_responder_sdp_media_type) AS sip_responder_sdp_media_type,
                      FIND_NOT_BLANK(@v1.$sip_responder_sdp_content, sip_responder_sdp_content) AS sip_responder_sdp_content,
                      @v1.$sip_duration_s + sip_duration_s AS sip_duration_s,
                      FIND_NOT_BLANK(@v1.$sip_bye, sip_bye) AS sip_bye,
                      rtp_payload_type_c2s,
                      rtp_payload_type_s2c,
                      rtp_pcap_path,
                      rtp_originator_dir
              - TRUNCATE v1
          - if: STREAM_DIR(flags) != 3 && @v1.isNull
            then:
              - |-
                SET v1 FROM withColumns(recv_time to rtp_originator_dir)
          - if: STREAM_DIR(flags) == 3
            then:
              - |-
                OUTPUT ok FROM withColumns(recv_time to rtp_originator_dir)
          - SCHEDULING USING EVENT TIME FOR NOW + 60 * 1000
    schedule:
      - if: '@v1.isNotNull'
        then:
          - |-
            OUTPUT fail FROM @v1.$recv_time AS recv_time,
                          @v1.$log_id AS log_id,
                          @v1.$decoded_as AS decoded_as,
                          @v1.$session_id AS session_id,
                          @v1.$start_timestamp_ms AS start_timestamp_ms,
                          @v1.$start_timestamp AS start_timestamp,
                          @v1.$end_timestamp_ms AS end_timestamp_ms,
                          @v1.$duration_ms AS duration_ms,
                          @v1.$tcp_handshake_latency_ms AS tcp_handshake_latency_ms,
                          @v1.$ingestion_time AS ingestion_time,
                          @v1.$processing_time AS processing_time,
                          @v1.$insert_time AS insert_time,
                          @v1.$device_id AS device_id,
                          @v1.$out_link_id AS out_link_id,
                          @v1.$in_link_id AS in_link_id,
                          @v1.$device_tag AS device_tag,
                          @v1.$data_center AS data_center,
                          @v1.$device_group AS device_group,
