      - name: sc_rsp_decrypted
        data-type: ARRAY<BIGINT>
      - name: proxy_rule_list
        data-type: ARRAY<BIGINT>
      - name: proxy_action
        data-type: STRING
      - name: proxy_pinning_status
        data-type: INT
      - name: proxy_intercept_status
        data-type: INT
      - name: proxy_passthrough_reason
        data-type: STRING
      - name: proxy_client_side_latency_ms
        data-type: BIGINT
      - name: proxy_server_side_latency_ms
        data-type: BIGINT
      - name: proxy_client_side_version
        data-type: STRING
      - name: proxy_server_side_version
        data-type: STRING
      - name: proxy_cert_verify
        data-type: INT
      - name: proxy_intercept_error
        data-type: STRING
      - name: monitor_mirrored_pkts
        data-type: INT
      - name: monitor_mirrored_bytes
        data-type: INT
      ## Source
      - name: client_ip
        data-type: STRING
      - name: client_port
        data-type: INT
      - name: client_os_desc
        data-type: STRING
      - name: client_geolocation
        data-type: STRING
      - name: client_country
        data-type: STRING
      - name: client_super_administrative_area
        data-type: STRING
      - name: client_administrative_area
        data-type: STRING
      - name: client_sub_administrative_area
        data-type: STRING
      - name: client_asn
        data-type: BIGINT
      - name: subscriber_id
        data-type: STRING
      - name: imei
        data-type: STRING
      - name: imsi
        data-type: STRING
      - name: phone_number
        data-type: STRING
      - name: apn
        data-type: STRING
      ## Destination
      - name: server_ip
        data-type: STRING
      - name: server_port
        data-type: INT
      - name: server_os_desc
        data-type: STRING
      - name: server_geolocation
        data-type: STRING
      - name: server_country
        data-type: STRING
      - name: server_super_administrative_area
        data-type: STRING
      - name: server_administrative_area
        data-type: STRING
      - name: server_sub_administrative_area
        data-type: STRING
      - name: server_asn
        data-type: BIGINT
      - name: server_fqdn
        data-type: STRING
      - name: server_domain
        data-type: STRING
      - name: fqdn_category_list
        data-type: ARRAY<BIGINT>
      ## Application
      - name: app_transition
        data-type: STRING
      - name: app
        data-type: STRING
      - name: app_debug_info
        data-type: STRING
      - name: app_content
        data-type: STRING
      - name: app_extra_info
        data-type: STRING
      ## Protocol
      - name: ip_protocol
        data-type: STRING
      - name: decoded_path
        data-type: STRING
      ## SIP
